<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#40b983"/>
      <stop offset="1" stop-color="#3fa7d6"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#40b983"/>
      <stop offset="0.5" stop-color="#8ef0cf"/>
      <stop offset="1" stop-color="#3fa7d6"/>
    </linearGradient>
  </defs>
  <style>
    .wa { animation: m 12s linear infinite; }
    .wb { animation: m 18s linear infinite reverse; }
    .wc { animation: m 9s linear infinite; }
    @keyframes m { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    .t1 { font: 800 30px 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; animation: glow 3s ease-in-out infinite; }
    .t2 { font: 500 15px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #a9bacb; }
    @keyframes glow { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
  </style>

  <text class="t1" x="600" y="52" text-anchor="middle" fill="url(#txt)">Thanks for visiting!</text>
  <text class="t2" x="600" y="82" text-anchor="middle">let's build something great together  ✦</text>

  <g class="wb" opacity="0.25">
    <path d="M0 140 Q150 110 300 140 T600 140 T900 140 T1200 140 T1500 140 T1800 140 T2100 140 T2400 140 V200 H0Z" fill="url(#w1)"/>
  </g>
  <g class="wa" opacity="0.45">
    <path d="M0 155 Q150 125 300 155 T600 155 T900 155 T1200 155 T1500 155 T1800 155 T2100 155 T2400 155 V200 H0Z" fill="url(#w1)"/>
  </g>
  <g class="wc" opacity="0.9">
    <path d="M0 172 Q150 152 300 172 T600 172 T900 172 T1200 172 T1500 172 T1800 172 T2100 172 T2400 172 V200 H0Z" fill="url(#w1)"/>
  </g>
</svg>
