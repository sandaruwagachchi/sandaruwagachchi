<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#11201b"/>
    </linearGradient>
  </defs>
  <style>
    text { font: 16px ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .title { font-size: 13px; fill: #7d8590; }
    .p  { fill: #40b983; font-weight: 700; }
    .c  { fill: #e6edf3; }
    .o  { fill: #a9bacb; }
    .k  { fill: #3fa7d6; }
    .h  { fill: #8ef0cf; font-weight: 600; }
    .ln { opacity: 0; animation: show .35s ease-out forwards; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes show  { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
  </style>

  <rect x="0.5" y="0.5" width="899" height="389" rx="14" fill="#0d1117" stroke="#30363d"/>
  <path d="M14 0.5 H886 A13.5 13.5 0 0 1 899.5 14 V44 H0.5 V14 A13.5 13.5 0 0 1 14 0.5Z" fill="url(#bar)"/>
  <line x1="0.5" y1="44" x2="899.5" y2="44" stroke="#30363d"/>
  <circle cx="26" cy="22" r="7" fill="#ff5f57"/>
  <circle cx="50" cy="22" r="7" fill="#febc2e"/>
  <circle cx="74" cy="22" r="7" fill="#28c840"/>
  <text class="title" x="450" y="27" text-anchor="middle">sandaru@github: ~</text>

  <g class="ln" style="animation-delay:.3s"><text x="28" y="84"><tspan class="p">❯ </tspan><tspan class="c">whoami</tspan></text></g>
  <g class="ln" style="animation-delay:.8s"><text x="28" y="112"><tspan class="h">Sandaru Wagachchi</tspan><tspan class="o"> — Associate Software Engineer</tspan></text></g>

  <g class="ln" style="animation-delay:1.4s"><text x="28" y="152"><tspan class="p">❯ </tspan><tspan class="c">cat education.txt</tspan></text></g>
  <g class="ln" style="animation-delay:1.9s"><text x="28" y="180"><tspan class="o">Higher National Diploma </tspan><tspan class="k">@ NIBM</tspan></text></g>

  <g class="ln" style="animation-delay:2.5s"><text x="28" y="220"><tspan class="p">❯ </tspan><tspan class="c">ls ./skills</tspan></text></g>
  <g class="ln" style="animation-delay:3.0s"><text x="28" y="248"><tspan class="k">java  javascript  php  c  csharp  react-native  mysql  bootstrap</tspan></text></g>

  <g class="ln" style="animation-delay:3.6s"><text x="28" y="288"><tspan class="p">❯ </tspan><tspan class="c">echo $FOCUS</tspan></text></g>
  <g class="ln" style="animation-delay:4.1s"><text x="28" y="316"><tspan class="o">Building clean, scalable web &amp; mobile apps</tspan></text></g>

  <g class="ln" style="animation-delay:4.7s">
    <text x="28" y="356"><tspan class="p">❯ </tspan></text>
    <rect class="cursor" x="50" y="341" width="10" height="20" fill="#40b983"/>
